[project]
name = "mitos-api"
version = "0.1.0"
description = "Mitos Flow API backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pyyaml",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mitos_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
